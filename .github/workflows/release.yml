name: Release

# Fires on a pushed vX.Y.Z tag. Builds and pushes
# ghcr.io/sm-steel/setup-sops-age:X.Y.Z (tag with the leading "v" stripped).
#
# action.yml pins the image by digest, and this workflow can't know that
# digest until after this very build finishes -- see README.md's release
# procedure for the two-commit dance that gets the real digest into
# action.yml once this run completes (steps.build.outputs.digest / the job
# summary below carry the digest this workflow produced).
on:
  push:
    tags:
      - "v*.*.*"

# Third-party actions are pinned to commit SHAs, not tags -- a floating tag
# can be repointed by whoever controls the action's repo. There is no
# Dependabot here by choice, so pins are refreshed BY HAND. To bump one,
# resolve the tag and keep the trailing comment truthful:
#
#   gh api repos/<owner>/<repo>/git/ref/tags/vX.Y.Z --jq '.object'
#
# (If that returns "type": "tag" instead of "commit", dereference it via
# repos/<owner>/<repo>/git/tags/<sha> to get the actual commit SHA.) Read the
# release notes between the pinned version and the new one before bumping.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/setup-sops-age:${{ steps.version.outputs.version }}

      - name: Report the real image digest
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository_owner }}/setup-sops-age@${{ steps.build.outputs.digest }}"
          {
            echo "### Image digest"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/setup-sops-age@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
