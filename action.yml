name: 'Setup sops + age'
description: >
  Installs pinned, checksum-verified sops and age/age-keygen binaries onto
  GITHUB_PATH, so later plain `run:` steps in the same job can use them with
  no further setup.
branding:
  icon: 'lock'
  color: 'gray-dark'
runs:
  # NOT `using: docker` -- see README.md's "GITHUB_PATH gotcha" section.
  # A pure Docker container action has no access to the `github`/`runner`
  # context in its own action.yml (confirmed: "Unrecognized named-value:
  # 'runner'" / "'github'" at parse time), and RUNNER_TEMP/GITHUB_WORKSPACE
  # *inside* such a container are translated to container-internal mount
  # paths that don't exist on the runner once the container exits -- so a
  # pure `using: docker` action genuinely cannot self-expose files on
  # GITHUB_PATH for later native steps (see actions/runner#2522 and
  # community discussion #168949). This one native composite step is what
  # lets $RUNNER_TEMP resolve to the real host path, which it then bind
  # mounts into the (still fully Docker-based, still pinned by digest)
  # setup-sops-age image to pull the binaries out.
  using: 'composite'
  steps:
    - name: Extract sops/age/age-keygen from the pinned setup-sops-age image
      shell: bash
      run: |
        set -euo pipefail
        DEST_ROOT="${RUNNER_TEMP:-${GITHUB_WORKSPACE:-/tmp}}"
        DEST="${DEST_ROOT}/setup-sops-age-bin"
        mkdir -p "${DEST}"
        docker run --rm -v "${DEST}:/out" \
          ghcr.io/sm-steel/setup-sops-age@sha256:f6f15480c61db0b441945145913db4f0401a21ee69ae8a9bea84e5163956e5aa
        echo "${DEST}" >> "${GITHUB_PATH}"
