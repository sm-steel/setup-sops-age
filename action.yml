name: 'Setup sops + age'
description: >
  Installs pinned, checksum-verified sops and age/age-keygen binaries onto
  GITHUB_PATH, so later plain `run:` steps in the same job can use them with
  no further setup.
branding:
  icon: 'lock'
  color: 'gray-dark'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/sm-steel/setup-sops-age@sha256:0cf723202f561ea53af3a1715ff6f781cf5f009b185040c0d2c3418fe7fb59c1'
